<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080"><rect width="1080" height="1080" fill="#FBF6EC"/><rect x="40" y="40" width="1000" height="1000" rx="40" fill="none" stroke="#0F5E6B" stroke-width="6"/><text x="90" y="330" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="104" fill="#1B2B30">Dogs don't</text><text x="90" y="440" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="104" fill="#1B2B30">hate baths.</text><text x="90" y="600" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="104" fill="#E4572E">They hate</text><text x="90" y="710" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="104" fill="#E4572E">the kennel.</text><text x="90" y="810" font-family="'DM Sans', Arial, sans-serif" font-size="40" fill="#0F5E6B">One dog at a time, at your curb.</text><circle cx="140" cy="930" r="50" fill="#0F5E6B"/><g fill="#FBF6EC"><ellipse cx="140" cy="943" rx="18" ry="15"/><ellipse cx="117" cy="918" rx="7" ry="10"/><ellipse cx="132" cy="903" rx="7" ry="10"/><ellipse cx="148" cy="903" rx="7" ry="10"/><ellipse cx="163" cy="918" rx="7" ry="10"/></g><text x="215" y="945" font-family="Fraunces, Georgia, serif" font-weight="700" font-size="52" fill="#1B2B30">Rinse &amp; Roam</text></svg>
